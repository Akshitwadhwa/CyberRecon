services:
  - type: web
    name: cyberrecon-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: CYBERRECON_FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CYBERRECON_API_TOKEN
        sync: false
      - key: CYBERRECON_A2A_TOKEN
        sync: false
